[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "neetcode-500-dashboard"
version = "0.1.0"
description = "Local evidence-first NeetCode 500 learning dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.5,<1.19",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
neetcode-dashboard = "neetcode_dashboard.__main__:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neetcode_dashboard"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["neetcode_dashboard"]
